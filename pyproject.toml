[project]
name = "ha-llm-context"
version = "0.3.0"
description = "Condense Home Assistant traces, history, logbook, and errors into a timeline for a local LLM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
test = ["pytest>=8", "pydantic>=2", "mcp>=2,<3"]
mcp = ["mcp>=2,<3"]

[project.scripts]
ha-llm-context = "ha_llm_context.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
